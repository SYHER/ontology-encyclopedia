<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>온톨로지 백과사전</title>
<style>
:root{
  --font:"Lucida Grande",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --blue1:#7cc4ff;--blue2:#2a8bf2;--blue3:#0b5fd0;--ink:#1d2733;--sub:#5b6675;
  --glass:rgba(255,255,255,.72);--line:rgba(60,90,130,.28);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.6 var(--font);color:var(--ink);
  background:repeating-linear-gradient(0deg,#e9edf2 0 2px,#dfe4ea 2px 4px);
  padding:22px;display:flex}
.win{flex:1;display:flex;flex-direction:column;min-height:0;max-width:1280px;margin:0 auto;width:100%;
  border-radius:12px 12px 8px 8px;overflow:hidden;background:#fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.4),0 18px 50px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.2)}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 12px;
  background:linear-gradient(#f4f4f4,#cfcfcf);border-bottom:1px solid #8d8d8d;position:relative}
.lights{display:flex;gap:7px}
.lights i{width:14px;height:14px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.35);
  box-shadow:inset 0 -3px 4px rgba(255,255,255,.35),inset 0 2px 3px rgba(255,255,255,.7),0 1px 0 rgba(255,255,255,.6)}
.lights .r{background:radial-gradient(circle at 50% 30%,#ff9a8f,#e8392a 70%)}
.lights .y{background:radial-gradient(circle at 50% 30%,#ffe58a,#eeb11c 70%)}
.lights .g{background:radial-gradient(circle at 50% 30%,#a6f08c,#2fb62c 70%)}
.titlebar h1{position:absolute;left:0;right:0;text-align:center;margin:0;font-size:13px;font-weight:normal;
  text-shadow:0 1px 0 #fff;pointer-events:none}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;
  background:linear-gradient(#e3e3e3,#bdbdbd);border-bottom:1px solid #7d7d7d}
.search{flex:1;min-width:160px;max-width:340px;margin-left:auto;position:relative}
.search input{width:100%;height:26px;border-radius:13px;border:1px solid #7b8794;padding:0 12px 0 28px;
  font:inherit;background:#fff;box-shadow:inset 0 2px 3px rgba(0,0,0,.25);outline:none}
.search input:focus{box-shadow:inset 0 2px 3px rgba(0,0,0,.25),0 0 0 3px rgba(80,160,255,.6)}
.search:before{content:"";position:absolute;left:10px;top:8px;width:7px;height:7px;border:2px solid #777;border-radius:50%}
.search:after{content:"";position:absolute;left:19px;top:17px;width:5px;height:2px;background:#777;transform:rotate(45deg)}
.gel{font:inherit;font-size:12px;color:#1b2b44;cursor:pointer;padding:3px 14px;height:24px;border-radius:12px;
  border:1px solid #6f7f93;position:relative;overflow:hidden;white-space:nowrap;
  background:linear-gradient(#fdfdfd,#d5dbe3 50%,#c2cad5 51%,#e3e8ee);
  box-shadow:0 1px 2px rgba(0,0,0,.3),inset 0 1px 1px #fff}
.gel:hover{filter:brightness(1.05)}
.gel.on{color:#fff;text-shadow:0 -1px 0 rgba(0,40,110,.7);border-color:#0a4aa8;
  background:linear-gradient(#a9dcff,#4aa3f7 48%,#1a78e6 52%,#53b0ff);
  box-shadow:0 1px 3px rgba(0,60,140,.5),inset 0 1px 1px rgba(255,255,255,.9),inset 0 -2px 4px rgba(120,200,255,.6)}
.gel.on:before,.gel.big:before{content:"";position:absolute;left:6px;right:6px;top:1px;height:42%;border-radius:10px 10px 40% 40%;
  background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.1));pointer-events:none}
.gel.big{height:30px;padding:0 20px;color:#fff;text-shadow:0 -1px 0 rgba(0,40,110,.7);border-color:#0a4aa8;border-radius:15px;
  background:linear-gradient(#a9dcff,#4aa3f7 48%,#1a78e6 52%,#53b0ff)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.menu{display:none}
.body{flex:1;display:flex;min-height:0}
.side{width:230px;flex:none;overflow:auto;border-right:1px solid #8a97a8;
  background:linear-gradient(90deg,#dde4ee,#e9eef5)}
.side .hd{padding:8px 12px 4px;font-size:11px;font-weight:bold;color:#6a7a90;text-shadow:0 1px 0 #fff}
.side a{display:flex;justify-content:space-between;gap:6px;padding:4px 12px;color:var(--ink);text-decoration:none;cursor:pointer}
.side a small{color:var(--sub);font-size:10px;align-self:center}
.side a:hover{background:rgba(120,170,230,.25)}
.side a.cur{color:#fff;background:linear-gradient(#6cb2fb,#2a7fe6);text-shadow:0 -1px 0 rgba(0,40,110,.6)}
.side a.cur small{color:#dcecff}
.main{flex:1;overflow:auto;padding:20px 24px 30px;
  background:repeating-linear-gradient(0deg,#f4f6f9 0 2px,#ecf0f5 2px 4px)}
.panel{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(30,60,110,.18),inset 0 1px 0 rgba(255,255,255,.9)}
.panel h3{margin:0 0 6px;font-size:12px;color:#4a6a95;letter-spacing:.04em}
.hero h2{margin:0 0 4px;font-size:22px}
.hero p{margin:0;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{cursor:pointer;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:linear-gradient(rgba(255,255,255,.95),rgba(235,242,252,.8));
  box-shadow:0 2px 5px rgba(30,60,110,.18),inset 0 1px 0 #fff;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(30,60,110,.28),inset 0 1px 0 #fff}
.card b{font-size:14px}.card em{display:block;font-style:normal;font-size:11px;color:var(--sub)}
.card p{margin:6px 0 0;font-size:12px;color:#3a4656;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-block;font-size:10px;padding:0 9px;border-radius:9px;color:#fff;margin-bottom:4px;
  background:linear-gradient(#8ccbff,#2c86ef);text-shadow:0 -1px 0 rgba(0,40,110,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.detail h2{margin:4px 0 0;font-size:26px}.detail .en{color:var(--sub);margin-bottom:10px}
.detail .sum{font-size:15px;font-weight:bold;margin-bottom:6px}
.detail .txt{white-space:pre-wrap}
.ex{border-left:4px solid #4aa3f7;background:rgba(210,232,255,.5);padding:8px 12px;border-radius:0 8px 8px 0;white-space:pre-wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .gel{height:26px}
.graph{width:100%;height:auto;display:block}
.graph g.n{cursor:pointer}
.graph g.n:hover circle{filter:brightness(1.1)}
.empty{text-align:center;color:var(--sub);padding:40px}
.back{margin-bottom:12px}
.status{padding:3px 12px;font-size:11px;color:#444;text-align:center;text-shadow:0 1px 0 #fff;
  background:linear-gradient(#e6e6e6,#c6c6c6);border-top:1px solid #8d8d8d}
@media(max-width:720px){
  body{padding:0}.win{border-radius:0}
  .menu{display:inline-block}
  .side{position:absolute;z-index:5;top:0;bottom:0;left:0;width:78%;transform:translateX(-100%);transition:transform .2s;box-shadow:4px 0 16px rgba(0,0,0,.3)}
  .body{position:relative}.side.open{transform:none}
  .search{max-width:none;flex-basis:100%;margin-left:0;order:3}
  .main{padding:14px}
  .toolbar{max-height:none}
}
@media(prefers-color-scheme:dark){:root{--glass:rgba(255,255,255,.72)}}
</style>
</head>
<body>
<div class="win">
  <div class="titlebar"><div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div><h1>온톨로지 백과사전</h1></div>
  <div class="toolbar">
    <button class="gel menu" id="menu">☰ 목록</button>
    <div class="cats" id="cats"></div>
    <div class="search"><input id="q" type="search" placeholder="검색 (용어, 영문, 정의)" autocomplete="off"></div>
  </div>
  <div class="body">
    <nav class="side" id="side"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="status" id="status"></div>
</div>

<script>window.ONTO=window.ONTO||[];</script>
<script>
(window.ONTO = window.ONTO || []).push(
  {
    id: "ontology",
    term: "온톨로지",
    en: "Ontology",
    category: "철학·기초 개념",
    summary: "존재하는 것과 그 관계를 명시적으로 기술한 모델",
    definition: "온톨로지는 철학에서 존재 자체를 탐구하는 학문을 뜻했고, 정보과학에서는 특정 영역의 개념과 그 관계를 형식적이고 명시적으로 정의한 공유 명세를 가리킨다. 톰 그루버는 이를 '공유된 개념화에 대한 명시적 명세'라고 정의했다. 클래스, 속성, 관계, 공리로 구성되며 사람과 기계가 같은 의미로 데이터를 해석하도록 돕는다. 추론기를 통해 암묵적 지식을 도출하는 기반이 되기도 한다.",
    example: "병원 온톨로지에서 '환자', '진단', '약물' 클래스와 '처방받다' 관계를 정의해 서로 다른 시스템의 기록을 같은 의미로 통합한다.",
    related: ["conceptualization", "knowledge-representation", "owl", "ontology-engineering"]
  },
  {
    id: "epistemology",
    term: "인식론",
    en: "Epistemology",
    category: "철학·기초 개념",
    summary: "지식의 본성과 근거, 한계를 탐구하는 철학",
    definition: "인식론은 지식이 무엇이며 어떻게 얻어지고 무엇이 정당화된 믿음인지를 연구하는 철학의 한 분야다. 이성론과 경험론의 대립, 지식의 조건인 참, 믿음, 정당화 같은 논의가 중심을 이룬다. 인공지능과 지식공학에서는 시스템이 무엇을 안다고 말할 수 있는지, 지식을 어떻게 표현하고 검증할지에 대한 기반이 된다. 열린 세계 가정처럼 불완전한 지식을 다루는 방식도 인식론적 선택과 연결된다.",
    example: "추론기가 기록되지 않은 사실을 거짓이 아니라 알 수 없는 것으로 취급하는 것은 인식론적 입장을 반영한 설계다.",
    related: ["metaphysics", "ontology", "knowledge-representation", "open-world-assumption"]
  },
  {
    id: "metaphysics",
    term: "형이상학",
    en: "Metaphysics",
    category: "철학·기초 개념",
    summary: "존재와 실재의 근본 구조를 다루는 철학",
    definition: "형이상학은 존재, 실재, 시간, 인과, 속성, 개체와 보편자 같은 근본 범주를 탐구하는 철학의 핵심 분야다. 아리스토텔레스의 범주론에서 출발해 존재론이 그 하위 영역으로 발전했다. 정보시스템의 상위 온톨로지는 이러한 형이상학적 구분, 예컨대 연속체와 사건, 속성과 실체의 구분을 공학적으로 채택한다. 따라서 모델링의 근본 가정은 흔히 형이상학적 입장에 기대고 있다.",
    example: "BFO 같은 상위 온톨로지가 지속하는 사물과 일어나는 과정을 구분하는 것은 형이상학적 구분을 모델에 반영한 예다.",
    related: ["ontology", "epistemology", "upper-ontology", "entity"]
  },
  {
    id: "taxonomy",
    term: "분류체계",
    en: "Taxonomy",
    category: "철학·기초 개념",
    summary: "개념을 상하위 계층으로 분류한 체계",
    definition: "분류체계는 대상을 공통 특성에 따라 상위와 하위의 계층 구조로 나눈 것으로, 린네의 생물 분류가 대표적이다. 주로 '~의 한 종류다' 관계 하나만으로 구성되어 온톨로지보다 단순하다. 온톨로지는 여기에 다양한 속성과 관계, 제약, 공리를 더해 표현력을 확장한다. 웹에서는 SKOS 등으로 분류체계를 표현하며 많은 온톨로지의 뼈대가 된다.",
    example: "상품 분류에서 '가전 > 주방가전 > 전기밥솥'처럼 상하위 범주를 나누는 것이 분류체계다.",
    related: ["ontology", "subsumption", "skos", "class"]
  },
  {
    id: "conceptualization",
    term: "개념화",
    en: "Conceptualization",
    category: "철학·기초 개념",
    summary: "영역을 개념과 관계로 추상화하는 과정",
    definition: "개념화는 특정 영역에 존재하는 객체, 개념, 관계를 추상적으로 정리하여 하나의 모델로 파악하는 과정이나 그 결과를 말한다. 제네세레스와 닐슨은 개념화를 영역의 대상과 그 사이의 관계 집합으로 보았고, 그루버는 온톨로지를 이 개념화의 명시적 명세로 정의했다. 같은 영역이라도 관점에 따라 다른 개념화가 가능하며, 이 선택이 모델의 용도를 좌우한다. 온톨로지 개발의 첫 단계는 이 개념화를 합의하는 일이다.",
    example: "같은 대학이라도 행정 시스템은 '학생'을 학적 기준으로, 도서관은 '이용자'로 개념화한다.",
    related: ["ontology", "knowledge-representation", "ontology-engineering", "competency-question"]
  },
  {
    id: "semantics",
    term: "의미론",
    en: "Semantics",
    category: "철학·기초 개념",
    summary: "기호와 표현이 가리키는 의미를 다루는 분야",
    definition: "의미론은 언어와 기호, 형식 표현이 무엇을 의미하는지를 연구하는 분야다. 논리학과 컴퓨터과학에서는 형식 언어의 문장이 어떤 모델에서 참이 되는지를 규정하는 모델 이론적 의미론이 쓰인다. 시맨틱 웹의 RDF와 OWL도 이런 형식적 의미론을 가져서 서로 다른 시스템이 같은 결론을 도출할 수 있다. 구문이 형식의 모양이라면 의미론은 그 형식이 가리키는 바다.",
    example: "OWL에서 어떤 클래스의 하위 클래스로 선언하면 그 클래스의 모든 인스턴스에 대해 포함 관계가 형식적으로 보장된다.",
    related: ["knowledge-representation", "first-order-logic", "semantic-web", "rdfs"]
  },
  {
    id: "knowledge-representation",
    term: "지식 표현",
    en: "Knowledge Representation",
    category: "철학·기초 개념",
    summary: "지식을 기계가 처리 가능한 형식으로 나타내는 일",
    definition: "지식 표현은 세계에 대한 지식을 컴퓨터가 저장하고 추론할 수 있는 형식으로 나타내는 인공지능의 연구 분야다. 논리, 규칙, 의미망, 프레임, 온톨로지 등이 대표적 방식이다. 좋은 표현은 표현력과 추론의 계산 복잡도 사이에서 균형을 잡아야 한다. 기술논리는 이 균형을 고려해 설계된 형식이며 OWL의 이론적 토대가 된다.",
    example: "'모든 의사는 사람이다' 같은 지식을 논리식이나 OWL 공리로 적어 두면 추론기가 새로운 사실을 이끌어 낸다.",
    related: ["ontology", "description-logic", "first-order-logic", "knowledge-graph"]
  },
  {
    id: "upper-ontology",
    term: "상위 온톨로지",
    en: "Upper Ontology",
    category: "철학·기초 개념",
    summary: "여러 영역에 공통되는 최상위 범주의 온톨로지",
    definition: "상위 온톨로지는 개체, 사건, 속성, 시간처럼 특정 도메인에 구애받지 않는 가장 일반적인 개념을 정의한 온톨로지다. BFO, DOLCE, SUMO 등이 대표적이며 서로 다른 도메인 온톨로지가 공통 기반 위에서 정렬되도록 돕는다. 이를 채택하면 일관된 모델링 원칙을 얻고 상호운용성이 높아진다. 다만 철학적 입장이 달라 단일한 합의안은 없다.",
    example: "BFO를 상위 온톨로지로 삼아 여러 생명과학 온톨로지가 '과정'과 '물질적 개체' 같은 최상위 구분을 공유한다.",
    related: ["metaphysics", "ontology-alignment", "reuse-modularization", "entity"]
  },
  {
    id: "entity",
    term: "개체",
    en: "Entity",
    category: "철학·기초 개념",
    summary: "구별 가능한 하나의 존재 또는 데이터 대상",

    definition: "schema.org는 2011년 구글, 마이크로소프트, 야후, 얀덱스가 공동으로 출범시킨 웹 페이지용 구조화 데이터 어휘집이다. Thing을 최상위로 하는 클래스 계층과 속성을 제공하며, Person, Product, Event, Recipe 같은 일반적 개념을 폭넓게 포괄한다. 마이크로데이터, RDFa, JSON-LD 등 여러 문법으로 웹 문서에 삽입할 수 있고, 현재는 커뮤니티 주도로 확장된다. 검색 결과의 리치 스니펫과 지식 패널 같은 기능의 기반이 된다.",

  {

    related: ["taxonomy", "ontology-engineering", "metadata", "subsumption"]
  },
  {

    term: "SNOMED CT",

    category: "산업·실제 사례",

    example: "진료 기록에 심근경색을 SNOMED CT 개념으로 코딩해 두면 허혈성 심질환 하위 개념까지 포함한 환자 검색이 가능하다.",
    related: ["description-logic", "reasoner", "subsumption", "data-integration"]
  },
  {
    id: "fibo",

    en: "FIBO (Financial Industry Business Ontology)",

    definition: "FIBO는 EDM 카운슬과 OMG가 함께 개발하는 금융 산업용 개념 모델이자 OWL 온톨로지이다. 금융 상품, 법인, 계약, 시장, 대출 등 금융 분야의 공통 개념과 관계를 업계 합의로 정의한다. 모듈 구조로 나뉘어 있으며 개념 정의가 명확해 규제 보고와 위험 데이터 집계에 활용된다. 사내 시스템마다 다른 용어를 공통 의미로 정렬하는 데 도움이 된다.",
    example: "은행이 여러 시스템에 흩어진 거래 상대방 정보를 FIBO의 법인 개념에 매핑해 위험 노출을 통합 집계한다.",
    related: ["owl", "data-integration", "reuse-modularization", "master-data"]
  },
  {
    id: "foaf",
    term: "FOAF",
    en: "FOAF (Friend of a Friend)",
    category: "산업·실제 사례",
    summary: "사람과 관계를 기술하는 초기 시맨틱 웹 어휘",
    definition: "FOAF는 2000년경 댄 브릭클리와 리비 밀러가 만든, 사람과 그들의 관계, 활동을 RDF로 기술하는 어휘이다. Person, Agent, Organization 같은 클래스와 name, knows, mbox, homepage 같은 속성을 정의한다. 분산된 개인 프로필 문서를 서로 연결해 소셜 네트워크를 웹 상에서 표현하자는 아이디어에서 출발했다. 시맨틱 웹에서 가장 널리 재사용되는 어휘 중 하나로 꼽힌다.",
    example: "개인 홈페이지의 RDF 프로필에 foaf:knows로 지인을 연결하면 서로 다른 사이트의 프로필이 하나의 그래프로 이어진다.",
    related: ["rdf", "semantic-web", "linked-data", "namespace-uri"]
  },
  {
    id: "dublin-core",
    term: "더블린 코어",
    en: "Dublin Core",
    category: "산업·실제 사례",
    summary: "자원 설명을 위한 범용 메타데이터 요소 집합",
    definition: "더블린 코어는 1995년 미국 오하이오주 더블린에서 열린 워크숍에서 시작된 범용 메타데이터 표준으로, DCMI가 관리한다. 제목, 작성자, 주제, 설명, 날짜, 형식, 식별자 등 15개의 기본 요소로 이루어져 있고, 이후 dcterms 이름공간에서 더 많은 속성과 클래스로 확장되었다. 도서관, 아카이브, 웹 자원 등 다양한 분야에서 문서와 자료를 기술하는 데 쓰인다. ISO 15836과 같은 표준으로도 채택되었다.",
    example: "디지털 아카이브가 각 문서의 제목, 저자, 발행일을 dc:title, dc:creator, dc:date로 기술해 검색과 교환에 활용한다.",
    related: ["metadata", "namespace-uri", "rdf", "data-catalog"]
  },
  {
    id: "palantir-ontology",
    term: "팔란티어 온톨로지",
    en: "Palantir Ontology",
    category: "산업·실제 사례",
    summary: "기업 데이터와 업무 행동을 잇는 운영형 온톨로지",
    definition: "팔란티어 온톨로지는 팔란티어 파운드리 플랫폼에서 조직의 데이터를 객체, 속성, 링크로 모델링한 의미 계층이다. 학술적 온톨로지와 달리 실제 데이터셋과 연결되고, 객체에 대해 수행할 수 있는 액션과 함수, 권한까지 포함하는 운영 중심 설계가 특징이다. 이를 통해 분석뿐 아니라 업무 의사결정과 시스템 쓰기 작업을 한곳에서 처리한다. 최근에는 AI 에이전트가 기업 데이터를 이해하고 행동하는 기반으로도 활용된다.",
    example: "항공사가 항공기, 정비 이력, 부품 재고를 객체로 정의하고 정비 일정 변경 액션을 온톨로지에서 바로 실행한다.",
    related: ["ontology", "knowledge-graph", "ai-agent-ontology", "data-integration"]
  }
);

</script>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var raw=Array.isArray(window.ONTO)?window.ONTO:[];
var map={},items=[];
raw.forEach(function(e){if(e&&e.id&&!map[e.id]){map[e.id]=e;items.push(e)}});
items.sort(function(a,b){return String(a.term).localeCompare(String(b.term),"ko")});
// 연관 관계 (존재하는 것만, 양방향)
var rel={};
items.forEach(function(e){rel[e.id]=rel[e.id]||{out:[],inn:[]}});
items.forEach(function(e){(e.related||[]).forEach(function(r){
  if(r!==e.id&&map[r]){ if(rel[e.id].out.indexOf(r)<0)rel[e.id].out.push(r);
    if(rel[r].inn.indexOf(e.id)<0)rel[r].inn.push(e.id)}})});
function links(id){var o=rel[id].out.slice();rel[id].inn.forEach(function(x){if(o.indexOf(x)<0)o.push(x)});return o}
var cats=[],catColor={};
items.forEach(function(e){if(e.category&&cats.indexOf(e.category)<0)cats.push(e.category)});
var pal=["#2a8bf2","#e8803a","#3aa655","#9b5de5","#d6455d","#1fa5a5","#c9a227","#6c7a89","#e05aa0","#5a6ee0"];
cats.forEach(function(c,i){catColor[c]=pal[i%pal.length]});
var state={cat:"",q:"",id:""};

function matches(e){
  if(state.cat&&e.category!==state.cat)return false;
  var q=state.q.trim().toLowerCase();if(!q)return true;
  return [e.term,e.en,e.summary,e.definition,e.category].join(" ").toLowerCase().indexOf(q)>=0;
}
function renderCats(){
  var h='<button class="gel'+(state.cat?'':' on')+'" data-c="">전체</button>';
  cats.forEach(function(c){h+='<button class="gel'+(state.cat===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'});
  $("cats").innerHTML=h;
}
function renderSide(){
  var list=items.filter(matches),h='<div class="hd">가나다순 · '+list.length+'개</div>';
  list.forEach(function(e){h+='<a data-id="'+esc(e.id)+'" class="'+(e.id===state.id?'cur':'')+'"><span>'+esc(e.term)+'</span><small>'+esc(e.en||"")+'</small></a>'});
  if(!list.length)h+='<div class="empty">결과 없음</div>';
  $("side").innerHTML=h;
  $("status").textContent=items.length?(list.length+" / "+items.length+" 항목"):"데이터를 불러오는 중이거나 항목이 없습니다";
}
function card(e){
  return '<div class="card" data-id="'+esc(e.id)+'"><span class="tag" style="background:'+(catColor[e.category]?'':'')+'">'+esc(e.category||"")+'</span><b> '+esc(e.term)+'</b><em>'+esc(e.en||"")+'</em><p>'+esc(e.summary||"")+'</p></div>';
}
function renderHome(){
  var list=items.filter(matches);
  var h='<div class="panel hero"><h2>온톨로지 백과사전</h2><p>온톨로지와 지식 표현에 관한 핵심 용어를 찾아보세요. 검색하거나 카테고리를 선택하고, 카드를 눌러 자세히 확인하세요.</p></div><div class="grid">';
  list.forEach(function(e){h+=card(e)});
  h+='</div>';
  if(!list.length)h+='<div class="panel empty">조건에 맞는 항목이 없습니다.</div>';
  $("main").innerHTML=h;
}
function graph(e){
  var nb=links(e.id).map(function(i){return map[i]});
  if(!nb.length)return '';
  var W=640,H=nb.length>8?460:380,cx=W/2,cy=H/2,R=Math.min(W,H)/2-52,s='';
  nb.forEach(function(n,i){var a=2*Math.PI*i/nb.length-Math.PI/2,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);n._x=x;n._y=y;
    var both=rel[e.id].out.indexOf(n.id)>=0&&rel[e.id].inn.indexOf(n.id)>=0;
    s+='<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#7aa6d8" stroke-width="'+(both?2.5:1.5)+'"'+(both?'':' stroke-dasharray="4 3"')+'/>'});
  nb.forEach(function(n){var col=catColor[n.category]||"#2a8bf2",lab=String(n.term);if(lab.length>9)lab=lab.slice(0,8)+"…";
    s+='<g class="n" data-id="'+esc(n.id)+'"><title>'+esc(n.term)+'</title><circle cx="'+n._x+'" cy="'+n._y+'" r="25" fill="'+col+'" stroke="rgba(0,0,0,.35)"/><ellipse cx="'+n._x+'" cy="'+(n._y-11)+'" rx="17" ry="9" fill="rgba(255,255,255,.55)"/><text x="'+n._x+'" y="'+(n._y+42)+'" text-anchor="middle" font-size="12" fill="#1d2733" font-family="Lucida Grande,Apple SD Gothic Neo,sans-serif">'+esc(lab)+'</text></g>'});
  var c=catColor[e.category]||"#2a8bf2",cl=String(e.term);if(cl.length>8)cl=cl.slice(0,7)+"…";
  s+='<g><circle cx="'+cx+'" cy="'+cy+'" r="38" fill="'+c+'" stroke="rgba(0,0,0,.45)" stroke-width="1.5"/><ellipse cx="'+cx+'" cy="'+(cy-17)+'" rx="26" ry="13" fill="rgba(255,255,255,.55)"/><text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width=".4" font-family="Lucida Grande,Apple SD Gothic Neo,sans-serif">'+esc(cl)+'</text></g>';
  return '<div class="panel"><h3>관계도</h3><svg class="graph" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="연관 관계도">'+s+'</svg><div style="font-size:11px;color:var(--sub)">실선: 상호 연관 · 점선: 한쪽 방향 연관 · 노드를 눌러 이동</div></div>';
}
function renderDetail(e){
  var chips=links(e.id).map(function(i){return '<button class="gel" data-id="'+esc(i)+'">'+esc(map[i].term)+'</button>'}).join("");
  var h='<button class="gel back" id="back">‹ 홈</button><div class="panel detail"><span class="tag" style="background:'+(catColor[e.category]||'')+'">'+esc(e.category||"")+'</span><h2>'+esc(e.term)+'</h2><div class="en">'+esc(e.en||"")+'</div>'
   +'<div class="sum">'+esc(e.summary||"")+'</div></div>'
   +'<div class="panel"><h3>정의</h3><div class="txt">'+esc(e.definition||"")+'</div></div>'
   +(e.example?'<div class="panel"><h3>예시</h3><div class="ex">'+esc(e.example)+'</div></div>':'')
   +graph(e)
   +'<div class="panel"><h3>연관 항목</h3>'+(chips?'<div class="chips">'+chips+'</div>':'<span style="color:var(--sub)">연관 항목이 없습니다.</span>')+'</div>';
  $("main").innerHTML=h;
}
function render(){
  renderCats();renderSide();
  var e=state.id&&map[state.id];
  if(e){renderDetail(e);document.title=e.term+" · 온톨로지 백과사전"}
  else{renderHome();document.title="온톨로지 백과사전"}
  $("main").scrollTop=0;
}
function go(id){
  var h=id?"#"+encodeURIComponent(id):"";
  if(location.hash===h||(!id&&!location.hash)){state.id=id;render()}
  else location.hash=h;
  $("side").classList.remove("open");
}
function fromHash(){
  var id="";try{id=decodeURIComponent(location.hash.slice(1))}catch(_){}
  state.id=map[id]?id:"";render();
}
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-id],[data-c],#back,#menu");if(!t)return;
  if(t.id==="menu"){$("side").classList.toggle("open");return}
  if(t.id==="back"){go("");return}
  if(t.hasAttribute("data-c")){state.cat=t.getAttribute("data-c");
    if(state.id){go("")}else render();return}
  var id=t.getAttribute("data-id");if(id)go(id);
});
